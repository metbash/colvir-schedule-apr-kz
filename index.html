<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colvir Schedule & APR Calculator (KZ)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            background: #f5f6f8;
            color: #111;
        }
        .app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            margin: 0 0 20px;
            font-size: 28px;
        }
        .grid {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 16px;
        }
        .card {
            background: #fff;
            border: 1px solid #dfe3e8;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,.03);
        }
        .section-title {
            font-weight: 700;
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            margin: 10px 0 4px;
            color: #333;
        }
        input, select, button {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 10px;
            border: 1px solid #cfd6dd;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
        }
        button {
            border: none;
            background: #1976d2;
            color: #fff;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #1565c0;
        }
        button.secondary {
            background: #5f6b7a;
        }
        button.secondary:hover {
            background: #4e5966;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 1100px;
        }
        th, td {
            border: 1px solid #e3e7eb;
            padding: 7px 8px;
            text-align: right;
            white-space: nowrap;
        }
        th {
            background: #f7f9fb;
            text-align: center;
            font-weight: 700;
        }
        td.left, th.left {
            text-align: left;
        }
        .muted {
            color: #667085;
            font-size: 12px;
            line-height: 1.4;
        }
        .error {
            color: #b42318;
            white-space: pre-wrap;
            margin-top: 10px;
            font-size: 13px;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-top: 12px;
        }
        .summary-item {
            background: #f8fafc;
            border: 1px solid #e6ebf0;
            border-radius: 8px;
            padding: 12px;
        }
        .summary-item .label {
            font-size: 12px;
            color: #667085;
        }
        .summary-item .value {
            margin-top: 4px;
            font-size: 18px;
            font-weight: 700;
        }
        .grace-table {
            width: 100%;
            min-width: 0;
        }
        .grace-table th, .grace-table td {
            text-align: center;
        }
        .small-btn {
            width: auto;
            padding: 7px 10px;
            margin-top: 0;
            font-size: 13px;
        }
        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .toolbar button {
            width: auto;
        }
    </style>
</head>
<body>
<div class="app">
    <h1>Colvir Schedule & APR Calculator (KZ)</h1>

    <div class="grid">
        <div class="card">
            <div class="section-title">Параметры займа</div>

            <label>Сумма кредита</label>
            <input id="principal" type="number" value="1000000" step="0.01">

            <label>Ставка, % годовых</label>
            <input id="annualRate" type="number" value="25" step="0.01">

            <label>Срок, месяцев</label>
            <input id="term" type="number" value="12" step="1">

            <label>Дата начала / выдачи</label>
            <input id="issueDate" type="date" value="2026-07-15">

            <label>Дата первого платежа</label>
            <input id="firstPaymentDate" type="date" value="2026-08-15">

            <label>Дата последнего платежа</label>
            <input id="lastPaymentDate" type="date" value="2027-07-15">

            <label>Метод погашения</label>
            <select id="paymentMethod">
                <option value="EQUAL_PRINCIPAL">Равные части ОД</option>
                <option value="ANNUITY">Аннуитет</option>
            </select>

            <div class="section-title" style="margin-top:16px;">Льготные периоды</div>
            <div class="muted">
                Отдельные колонки: ОД и проценты. Добавляй строки как в банковской таблице.
            </div>

            <div class="toolbar">
                <button id="addGraceRowBtn" class="small-btn">Добавить строку</button>
                <button id="clearGraceRowsBtn" class="small-btn secondary">Очистить</button>
            </div>

            <div style="margin-top:10px; overflow-x:auto;">
                <table class="grace-table" id="graceTable">
                    <thead>
                    <tr>
                        <th>С</th>
                        <th>По</th>
                        <th>ОД</th>
                        <th>%</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <button id="calcBtn">Рассчитать график</button>
            <div id="errorBox" class="error"></div>
        </div>

        <div class="card">
            <div class="section-title">График платежей</div>
            <div class="table-wrap">
                <table id="scheduleTable">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Дата</th>
                        <th>Дней</th>
                        <th>ОД (начало)</th>
                        <th>Principal</th>
                        <th>Interest</th>
                        <th>Payment</th>
                        <th>ОД (конец)</th>
                        <th>Тип</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="summary" id="summary"></div>
        </div>
    </div>
</div>

<script type="module">
import Loan from "./src/models/Loan.js";
import GracePeriod from "./src/models/GracePeriod.js";
import ScheduleEngine from "./src/engine/ScheduleEngine.js";
import { PaymentMethod } from "./src/core/Enums.js";

const els = {
    principal: document.getElementById("principal"),
    annualRate: document.getElementById("annualRate"),
    term: document.getElementById("term"),
    issueDate: document.getElementById("issueDate"),
    firstPaymentDate: document.getElementById("firstPaymentDate"),
    lastPaymentDate: document.getElementById("lastPaymentDate"),
    paymentMethod: document.getElementById("paymentMethod"),
    graceTableBody: document.querySelector("#graceTable tbody"),
    addGraceRowBtn: document.getElementById("addGraceRowBtn"),
    clearGraceRowsBtn: document.getElementById("clearGraceRowsBtn"),
    calcBtn: document.getElementById("calcBtn"),
    errorBox: document.getElementById("errorBox"),
    scheduleBody: document.querySelector("#scheduleTable tbody"),
    summary: document.getElementById("summary")
};

function addGraceRow(data = {}) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
        <td><input type="number" class="g-start" value="${data.startPeriod ?? 1}" min="1" step="1"></td>
        <td><input type="number" class="g-end" value="${data.endPeriod ?? 1}" min="1" step="1"></td>
        <td><input type="checkbox" class="g-od" ${data.odGrace ? "checked" : ""}></td>
        <td><input type="checkbox" class="g-pct" ${data.percentGrace ? "checked" : ""}></td>
        <td><button type="button" class="small-btn secondary g-del">X</button></td>
    `;
    tr.querySelector(".g-del").addEventListener("click", () => tr.remove());
    els.graceTableBody.appendChild(tr);
}

function clearGraceRows() {
    els.graceTableBody.innerHTML = "";
}

function num(v) {
    const n = Number(v);
    return Number.isFinite(n) ? n : 0;
}

function fmt(v) {
    return Number(v || 0).toLocaleString("ru-RU", { maximumFractionDigits: 2 });
}

function formatDate(d) {
    const dt = new Date(d);
    const dd = String(dt.getDate()).padStart(2, "0");
    const mm = String(dt.getMonth() + 1).padStart(2, "0");
    const yyyy = dt.getFullYear();
    return `${dd}.${mm}.${yyyy}`;
}

function readGracePeriods() {
    const rows = [...els.graceTableBody.querySelectorAll("tr")];
    return rows.map(tr => {
        const startPeriod = num(tr.querySelector(".g-start").value);
        const endPeriod = num(tr.querySelector(".g-end").value);
        const odGrace = tr.querySelector(".g-od").checked;
        const percentGrace = tr.querySelector(".g-pct").checked;
        return new GracePeriod({
            startPeriod,
            endPeriod,
            odGrace,
            percentGrace
        });
    }).filter(r => r.startPeriod > 0 && r.endPeriod > 0);
}

function renderSchedule(rows, schedule) {
    els.scheduleBody.innerHTML = "";
    rows.forEach((row, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td class="left">${i}</td>
            <td class="left">${formatDate(row.paymentDate)}</td>
            <td>${fmt(row.days)}</td>
            <td>${fmt(row.openingBalance)}</td>
            <td>${fmt(row.principal)}</td>
            <td>${fmt(row.interest)}</td>
            <td>${fmt(row.payment)}</td>
            <td>${fmt(row.closingBalance)}</td>
            <td class="left">${row.rowType || ""}</td>
        `;
        els.scheduleBody.appendChild(tr);
    });

    els.summary.innerHTML = "";
    const items = [
        ["Общий ОД", schedule.totalPrincipal],
        ["Общие проценты", schedule.totalInterest],
        ["Общая сумма", schedule.totalPayment],
        ["Платежей", schedule.paymentsCount]
    ];
    for (const [label, value] of items) {
        const div = document.createElement("div");
        div.className = "summary-item";
        div.innerHTML = `<div class="label">${label}</div><div class="value">${fmt(value)}</div>`;
        els.summary.appendChild(div);
    }
}

els.addGraceRowBtn.addEventListener("click", () => addGraceRow());
els.clearGraceRowsBtn.addEventListener("click", clearGraceRows);

els.calcBtn.addEventListener("click", () => {
    els.errorBox.textContent = "";
    els.scheduleBody.innerHTML = "";
    els.summary.innerHTML = "";

    try {
        const loan = new Loan({
            principal: num(els.principal.value),
            annualRate: num(els.annualRate.value),
            term: parseInt(els.term.value, 10),
            issueDate: new Date(els.issueDate.value),
            firstPaymentDate: new Date(els.firstPaymentDate.value),
            lastPaymentDate: new Date(els.lastPaymentDate.value),
            paymentMethod: els.paymentMethod.value,
            gracePeriods: readGracePeriods()
        });

        const engine = new ScheduleEngine();
        const schedule = engine.generate(loan);
        renderSchedule(schedule.rows, schedule);
    } catch (e) {
        els.errorBox.textContent = e.message || String(e);
    }
});

addGraceRow({ startPeriod: 1, endPeriod: 2, odGrace: true, percentGrace: false });
</script>
</body>
</html>
